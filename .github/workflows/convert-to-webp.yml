
name: Convert Folder to WebP

on:
  workflow_dispatch:
    inputs:
      folder:
        description: 'Folder path to convert'
        required: true
        default: 'images/projects'
        type: string

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install Pillow

      - name: Convert images
        env:
          FOLDER: ${{ inputs.folder }}
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import os

          folder = Path(os.environ['FOLDER']).resolve()
          root = Path.cwd().resolve()

          if not folder.is_relative_to(root) or not folder.is_dir():
              raise SystemExit("Invalid folder path")

          files = [
              p for p in folder.rglob('*')
              if p.is_file() and p.suffix.lower() in ('.jpg', '.jpeg')
          ]

          converted = 0

          for path in files:
              output = path.with_suffix('.webp')

              try:
                  with Image.open(path) as img:
                      img = img.convert('RGB')
                      img.save(output, 'WEBP', quality=82, method=6)

                  print(f"OK: {path} -> {output}")
                  converted += 1

              except Exception as e:
                  print(f"ERROR: {path}: {e}")

          print(f"Converted: {converted} / {len(files)}")
          PY

      - name: Commit WebP files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (
            git commit -m "Convert images to WebP" &&
            git push
          )

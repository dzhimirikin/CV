
name: Convert Folder to WebP

on:
  workflow_dispatch:
    inputs:
      folder:
        description: 'Folder path to convert'
        required: true
        default: 'images/projects'
        type: string

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install Pillow

      - name: Convert PNG and JPG to WebP
        env:
          FOLDER: ${{ inputs.folder }}
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import os

          root = Path.cwd().resolve()
          folder = (root / os.environ['FOLDER']).resolve()

          if not folder.is_relative_to(root) or not folder.is_dir():
              raise SystemExit("Invalid folder path")

          extensions = {'.jpg', '.jpeg', '.png'}

          files = [
              p for p in folder.rglob('*')
              if p.is_file() and p.suffix.lower() in extensions
          ]

          converted = 0
          errors = 0

          for path in files:
              output = path.with_suffix('.webp')

              try:
                  with Image.open(path) as img:
                      img.load()

                      if img.mode in ('RGBA', 'LA') or 'transparency' in img.info:
                          img = img.convert('RGBA')
                      else:
                          img = img.convert('RGB')

                      quality = 90 if path.suffix.lower() == '.png' else 82

                      img.save(
                          output,
                          'WEBP',
                          quality=quality,
                          method=6
                      )

                  print(f"OK: {path} -> {output}")
                  converted += 1

              except Exception as e:
                  print(f"ERROR: {path}: {e}")
                  errors += 1

          print("--------------------------------")
          print(f"Found: {len(files)}")
          print(f"Converted: {converted}")
          print(f"Errors: {errors}")
          PY

      - name: Commit WebP files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (
            git commit -m "Convert PNG and JPG to WebP" &&
            git push
          )
